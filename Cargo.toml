[package]
name = "echo-api"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

# Smaller binary for the scratch image: ~2.0 MB -> ~1.1 MB.
[profile.release]
strip = true
lto = true
codegen-units = 1

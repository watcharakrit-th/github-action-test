name: Hello Workflow

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-nodejs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install the dependencies
        run: npm ci

      - name: Run the tests
        run: npm test
  hello:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Show a message
        run: echo "Hello from GitHub Actions"

      - name: Show the files
        run: ls -la

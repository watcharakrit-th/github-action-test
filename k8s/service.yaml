apiVersion: v1
kind: Service
metadata:
  name: echo-api
  labels:
    app.kubernetes.io/name: echo-api
spec:
  # NodePort so the local k3s container can publish it (cluster/docker-compose.yml maps 8081 -> 30081).
  type: NodePort
  selector:
    app.kubernetes.io/name: echo-api
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30081

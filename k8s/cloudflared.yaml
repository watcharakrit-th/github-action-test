# Free Cloudflare Quick Tunnel: publishes nginx at a random https://<words>.trycloudflare.com
# URL, no Cloudflare account needed. The URL changes whenever this pod restarts:
#   kubectl -n echo-api logs deploy/cloudflared | grep -o 'https://[a-z0-9-]*\.trycloudflare\.com'
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  labels:
    app.kubernetes.io/name: cloudflared
spec:
  replicas: 1 # every replica would get its own, different URL
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflared
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflared
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.10.7
          args:
            - tunnel
            - --no-autoupdate
            - --metrics=0.0.0.0:2000
            - --url=http://nginx:80
          ports:
            - name: metrics
              containerPort: 2000
          # Ready once the tunnel is connected. No liveness probe: a restart means a new URL,
          # and cloudflared reconnects dropped connections by itself.
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

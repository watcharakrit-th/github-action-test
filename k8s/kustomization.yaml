apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- echo-api.yaml
- nginx.yaml
- cloudflared.yaml
# Hash-suffixed name, so editing nginx.conf rolls the nginx pods.
configMapGenerator:
- files:
  - default.conf=nginx.conf
  name: nginx-conf
# CI rewrites newName/newTag after every image push on master
# (kustomize edit set image), which is what Argo CD then rolls out.
images:
- name: echo-api
  newName: docker.io/watcharakritth/mini-rust
  newTag: 0.1.0

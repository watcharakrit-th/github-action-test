apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- deployment.yaml
- service.yaml
# CI rewrites newName/newTag after every image push on master
# (kustomize edit set image), which is what Argo CD then rolls out.
images:
- name: echo-api
  newName: registry.example.com/echo-api
  newTag: latest

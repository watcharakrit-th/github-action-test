# Reverse proxy in front of echo-api; mounted as /etc/nginx/conf.d/default.conf.
server {
    listen 8080;
    server_tokens off;

    location / {
        proxy_pass http://echo-api:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
